name: Docker image

# When this runs:
#  - every push to main (tag: `:main`)
#  - every push of a `v*.*.*` tag (tags: `:vX.Y.Z`, `:X.Y.Z`, `:latest`)
#  - manual dispatch for one-off builds
#
# Publishes to ghcr.io/<owner>/<repo>, which after the repo rename is
# ghcr.io/awaithumans/awaithumans-human-in-the-loop-ai-agents. The legacy
# ghcr.io/awaithumans/awaithumans image is frozen at a pre-rename build.
# GHCR is free, integrates
# with GitHub auth (no extra secrets needed — GITHUB_TOKEN works), and
# supports multi-arch manifests out of the box.
#
# Security note: every ${{ ... }} expansion below is a trusted context
# value (github.repository, github.ref, github.actor, GITHUB_TOKEN,
# workflow outputs from pinned actions). No user-controlled fields
# like issue titles, commit messages, or PR bodies are interpolated
# into `run:` blocks — nothing to inject.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU lets us build linux/arm64 on an amd64 runner. Slower than
      # a native arm runner but free and simple; switch to the
      # `ubuntu-24.04-arm` runner for faster arm builds once it's GA on
      # public repos. For now cross-compile is fine — heavy work is
      # pure compute so the emulation overhead is bearable.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces tags for every trigger kind:
      # push main       → :main
      # push v1.2.3     → :v1.2.3, :1.2.3, :1.2, :1, :latest
      - name: Resolve image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cross-run cache — speeds up subsequent builds a lot.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-container-app:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only auto-deploy on pushes to main and version tags. Manual
    # workflow_dispatch runs still skip deploy unless the same
    # condition is met, so an opt-in rebuild doesn't punt prod by
    # accident.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve image tag to deploy
        id: tag
        # On a push to main → deploy `:main`. On a tag push → deploy
        # the matching `:vX.Y.Z` so the running revision is pinned to
        # the released image, not a moving `:latest`. Tag pushes also
        # rebuild `:main` (because the tag commit is on main), but the
        # tag deploy happens after and wins.
        #
        # Security: we strictly validate the resolved tag against
        # `^[a-zA-Z0-9._-]+$` before exporting it. Even though only
        # repo-writers can push tags, this prevents a maliciously
        # named tag from injecting shell metacharacters into the
        # later `az containerapp update --image ...:<tag>` call. Any
        # mismatch fails the job loudly instead of running attacker
        # input.
        env:
          GITHUB_REF_ENV: ${{ github.ref }}
        run: |
          if [[ "${GITHUB_REF_ENV}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_ENV##refs/tags/}"
          else
            tag="main"
          fi
          if ! [[ "${tag}" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Refusing to deploy: resolved image tag '${tag}' contains characters outside [a-zA-Z0-9._-]." >&2
            exit 1
          fi
          echo "image_tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Update Container App image
        uses: azure/CLI@v2
        env:
          # Pass all values through env so the inline script reads
          # them as shell variables — no `${{ ... }}` interpolation
          # inside the script body, no injection surface.
          CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          IMAGE_REPO: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        with:
          # Pinned to a known-good az CLI. Container Apps extension is
          # installed by default on this image, no `az extension add`
          # needed.
          azcliversion: 2.65.0
          inlineScript: |
            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE_REPO:$IMAGE_TAG"

      - name: Azure logout
        if: always()
        run: az logout
