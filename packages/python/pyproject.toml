[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling includes the whole `awaithumans` package by default, and
# that sweep picks up non-Python files (the email template `.html`/
# `.txt` loaded via importlib.resources at runtime). No force-include
# needed — if you add it, you get duplicate-name warnings.
[tool.hatch.build.targets.wheel]
packages = ["awaithumans"]

# Bundle alembic into the wheel under `awaithumans/_alembic/` so the
# installed package can find migrations + env.py without the dev-tree
# `packages/python/alembic.ini` being present. Dev checkouts use the
# outside copy; installed wheels fall through to the bundled one —
# resolved at runtime by `db/connection.py:_alembic_paths()`.
[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "awaithumans/_alembic/alembic.ini"
"alembic" = "awaithumans/_alembic/alembic"

[project]
name = "awaithumans"
version = "0.1.8"
description = "HITL infrastructure for AI agents. Your agent calls await_human(), a human reviews via Slack/email/dashboard, agent resumes with a typed response."
readme = "README.md"
license = "Apache-2.0"
# PEP 604 union syntax (`X | None`) is used throughout the codebase —
# that's 3.10+. Pydantic v2 evaluates annotations at runtime and crashes
# on 3.9 with "unsupported operand type(s) for |" if we claim 3.9 compat.
# Major agent frameworks (LangGraph, Temporal, OpenAI SDK) already
# require 3.10+, so no real user is left behind.
requires-python = ">=3.10"
authors = [
    { name = "Await Humans", email = "hello@awaithumans.dev" },
]
keywords = [
    # Problem keywords — what users type when they have the pain
    "human-in-the-loop", "hitl", "human-review", "human-feedback",
    "human-approval", "approval-workflow", "agent-supervision",
    "agent-handoff", "agent-workflow", "ai-agents",
    # Framework names — pair-search hits
    "langchain", "langgraph", "crewai", "autogen", "pydantic-ai",
    "temporal", "mcp",
    # Model / provider names
    "claude", "anthropic", "openai", "gpt", "gemini",
    # Use cases
    "kyc", "content-moderation", "agent-safety", "guardrails",
    # Mechanism / technical
    "callback", "webhook", "long-poll", "durable-workflow",
    # Competitor / category capture
    "human-layer", "agentops", "ai-infrastructure",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.0.0",
    "sqlmodel>=0.0.22",
    # `greenlet` is SQLAlchemy's C-extension dep for async sessions.
    # sqlmodel doesn't ship the `[asyncio]` extra transitively, so on
    # fresh installs the aiosqlite driver raises `ValueError: the
    # greenlet library is required` at first connection. List it
    # explicitly so `pip install awaithumans[server]` just works.
    "greenlet>=3.0",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    # asyncpg is the async runtime driver, but alembic uses *sync*
    # SQLAlchemy and SQLAlchemy's default sync Postgres dialect
    # (`postgresql://...`) imports psycopg2. Without it,
    # `alembic upgrade head` on a fresh Postgres deployment fails
    # with `ModuleNotFoundError: No module named 'psycopg2'` during
    # the server's startup lifespan — and the uvicorn lifespan
    # swallows the traceback, so the operator sees the container
    # exit silently. The `-binary` wheel avoids needing libpq + a
    # C compiler at install time.
    "psycopg2-binary>=2.9.10",
    "slack-sdk>=3.33.0",
    # slack_sdk has no runtime deps of its own — the async client
    # imports aiohttp lazily, so without this listed explicitly a fresh
    # `pip install awaithumans[server]` succeeds but any async Slack call
    # raises ModuleNotFoundError at runtime. List it directly.
    "aiohttp>=3.10.0",
    # Starlette only parses `application/x-www-form-urlencoded` /
    # `multipart/form-data` bodies when python-multipart is installed.
    # Slack sends interaction payloads as form-encoded, so without this
    # every interactions webhook 500s with an AssertionError. Not a
    # transitive dep of fastapi/starlette — must be declared.
    "python-multipart>=0.0.12",
    "resend>=2.0.0",
    "typer>=0.13.0",
    "cryptography>=43.0.0",
    "aiosmtplib>=3.0.0",
    # Password hashing for per-user dashboard login. argon2id is the
    # OWASP-recommended default for new systems (RFC 9106 params).
    "argon2-cffi>=23.1.0",
    # Embed-token sign/verify (HS256). PyPI package name is `pyjwt`;
    # import is `import jwt`. Used only in embed_token_service.py.
    "pyjwt>=2.8.0",
    # AwaitVerify landing demo extractor talks to Azure OpenAI via the
    # standard OpenAI SDK's `AsyncAzureOpenAI` client. The `[server]`
    # extra already pulls in slack-sdk + resend, so adding one more
    # provider SDK here keeps `pip install awaithumans[server]` as the
    # single command to stand up the full demo stack.
    "openai>=1.50.0",
    # Permissive date parsing for the demo schema_builder: the LLM
    # returns dates in whatever format appears on the document
    # (localised abbreviations, slashes, English long form). dateutil
    # absorbs all of those and emits a real `datetime.date` so the
    # Pydantic model accepts it without forcing the reviewer to
    # hand-fix every demo task.
    "python-dateutil>=2.9.0",
    # AwaitVerify landing demo backs onto the managed AwaitVerify
    # backend via the SDK's `verify_document`. That helper fragments
    # the document client-side (Pillow + pdf2image) and encrypts each
    # fragment with AES-256-GCM (cryptography). Bundling these in the
    # [server] extra so `awaithumans dev` is the single install command
    # for standing up the full demo stack.
    "Pillow>=10.0.0",
    "pdf2image>=1.17.0",
]
temporal = [
    "temporalio>=1.7.0",
    # HMAC verification of awaithumans callbacks. Lives in
    # `awaithumans.utils.webhook_signing` (PR #71); the temporal
    # callback receiver imports it without needing [server].
    "cryptography>=43.0.0",
]
langgraph = [
    "langgraph>=0.2.0",
    # Same as [temporal]: callback handlers verify webhook HMACs.
    "cryptography>=43.0.0",
]
verifier-claude = [
    "anthropic>=0.40.0",
]
verifier-openai = [
    "openai>=1.50.0",
]
verifier-gemini = [
    "google-generativeai>=0.8.0",
]
verifier-azure = [
    "openai>=1.50.0",
]
awaitverify = [
    # Client-side document fragmentation + AES-256-GCM encryption for
    # the AwaitVerify managed product. Kept out of the base install
    # so the core SDK stays lightweight (httpx + pydantic only).
    # pdf2image requires the `poppler` system binary at runtime —
    # documented in the VerifyDocumentLoadError hint and on
    # awaithumans.dev/awaitverify.
    "Pillow>=10.0.0",
    "pdf2image>=1.17.0",
    "cryptography>=43.0.0",
]
awaitverify-openai = [
    # Flow B via OpenAI (LLM). The SDK calls OpenAI on the customer's
    # machine with their API key — keys are never transmitted to
    # AwaitVerify.
    "openai>=1.50.0",
]
awaitverify-anthropic = [
    # Flow B via Anthropic / Claude (LLM, tool use).
    "anthropic>=0.40.0",
]
awaitverify-azure-openai = [
    # Flow B via Azure OpenAI deployment. Same Python SDK as openai.
    "openai>=1.50.0",
]
awaitverify-docling = [
    # Open source OCR + layout. Runs locally, no API key. Requires a
    # StructuringConfig (OpenAIStructuring / AnthropicStructuring /
    # AzureOpenAIStructuring) for the response_schema-matching step.
    "docling>=2.0.0",
]
awaitverify-paddleocr = [
    # Open source OCR. Runs locally, no API key. Requires a
    # StructuringConfig (see awaitverify-docling).
    "paddleocr>=2.7.0",
]
awaitverify-reducto = [
    # Reducto SaaS OCR. Customer brings their API key. Requires a
    # StructuringConfig.
    "reducto>=0.5.0",
]
awaitverify-azure-di = [
    # Azure Document Intelligence (formerly Form Recognizer).
    # Customer brings their endpoint + API key. Requires a
    # StructuringConfig.
    "azure-ai-documentintelligence>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
awaithumans = "awaithumans.cli.main:app"

[project.urls]
Homepage = "https://awaithumans.dev"
Repository = "https://github.com/awaithumans/awaithumans-human-in-the-loop-ai-agents"
Issues = "https://github.com/awaithumans/awaithumans-human-in-the-loop-ai-agents/issues"
Documentation = "https://awaithumans.dev/docs"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "T20"]

# FastAPI's `Depends(...)` / `Path(...)` / `Query(...)` / `Body(...)` in
# argument defaults is idiomatic — the whole dependency-injection system
# relies on it. Suppress B008 for these only.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]

# Email template renderers emit inline-styled HTML as fragment strings.
# Some fragments naturally exceed 100 chars; breaking them mangles the
# output and doesn't improve readability.
[tool.ruff.lint.per-file-ignores]
"awaithumans/server/channels/email/templates/renderers.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # `slow` covers tests that boot a real subprocess (Temporal
    # server, etc.). Skipped during fast iteration via
    # `pytest -m 'not slow'`; run by default in CI.
    "slow: tests that boot heavy fixtures (Temporal harness, etc.)",
]
